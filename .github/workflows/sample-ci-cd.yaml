name: CI-CD-Sample
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm install
        working-directory: services/sample-service
      - name: Run tests
        run: npm test || echo "No tests defined"
        working-directory: services/sample-service
      - name: Build Docker image
        run: docker build -t sample-service:latest .
        working-directory: services/sample-service
      - name: Push manifest update (simulated)
        run: echo "Update GitOps manifest with new image tag"
