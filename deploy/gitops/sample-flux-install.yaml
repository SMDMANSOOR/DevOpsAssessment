apiVersion: v1
kind: Namespace
metadata:
  name: flux-system
---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m0s
  url: https://github.com/SMDMANSOOR/DevOpsAssessment
  branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1beta2
kind: Kustomization
metadata:
  name: sample-service
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./deploy/helm/sample-service
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: default
